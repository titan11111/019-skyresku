<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Parachute Rescue Deluxe</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tone.js for Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Chakra Petch', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            background-color: #0d1117;
            overflow: hidden;
        }

        .font-pixel {
            font-family: 'Press Start 2P', monospace;
        }

        /* Retro LCD Style Framework */
        .lcd-screen {
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8), 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        /* Glass Reflection Effect */
        .glass-reflection {
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.02) 40%, rgba(255,255,255,0) 100%);
            pointer-events: none;
        }

        /* Scanline Overlay for Arcade Feel */
        .scanlines {
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* Custom Scrollbar and Buttons */
        .btn-arcade {
            transition: transform 0.05s ease, box-shadow 0.05s ease;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.4);
        }
        .btn-arcade:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
        }

        /* Glowing Animation for Combos */
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        .animate-glow {
            animation: pulse-glow 1s infinite;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-between p-2 md:p-4 text-white">

    <!-- Top Navigation Header -->
    <header class="w-full max-w-4xl flex items-center justify-between px-3 py-2 bg-slate-900/80 border border-slate-700/60 rounded-xl backdrop-blur-md z-10">
        <div class="flex items-center gap-2">
            <i class="fa-solid font-bold text-amber-400 text-xl md:text-2xl fa-parachute-box"></i>
            <h1 class="font-pixel text-xs md:text-base text-amber-400 tracking-wider">PARACHUTE <span class="text-cyan-400">DELUXE</span></h1>
        </div>

        <div class="flex items-center gap-2 md:gap-4">
            <!-- Theme Toggle -->
            <button id="btn-theme" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-600 text-xs flex items-center gap-1.5 transition">
                <i class="fa-solid fa-palette text-cyan-400"></i>
                <span id="theme-label" class="hidden sm:inline">LCD Mode</span>
            </button>

            <!-- Sound Toggle -->
            <button id="btn-sound" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded-lg border border-slate-600 text-xs flex items-center justify-center min-w-[36px] transition">
                <i id="sound-icon" class="fa-solid fa-volume-high text-emerald-400"></i>
            </button>

            <!-- Pause Button -->
            <button id="btn-pause" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded-lg border border-slate-600 text-xs flex items-center justify-center min-w-[36px] transition">
                <i class="fa-solid fa-pause text-amber-400"></i>
            </button>
        </div>
    </header>

    <!-- Main Game Container -->
    <main class="relative w-full max-w-4xl flex-1 my-2 flex flex-col items-center justify-center">
        <!-- Cabinet/Screen Wrapper -->
        <div id="game-frame" class="relative w-full h-full max-h-[680px] bg-amber-100 rounded-2xl p-2 md:p-4 border-4 border-amber-600/40 lcd-screen overflow-hidden flex flex-col">
            
            <!-- Glass Overlay -->
            <div class="absolute inset-0 glass-reflection z-10"></div>
            <!-- CRT Scanlines -->
            <div id="scanlines" class="absolute inset-0 scanlines z-10 opacity-30"></div>

            <!-- In-Game HUD Header -->
            <div class="relative z-20 flex justify-between items-center mb-1 px-2 py-1 bg-black/10 rounded-lg text-slate-900 font-pixel text-xs sm:text-sm">
                <!-- Score Display -->
                <div class="flex flex-col">
                    <span class="text-[10px] opacity-70">SCORE</span>
                    <span id="hud-score" class="text-sm sm:text-lg font-bold">00000</span>
                </div>

                <!-- Combo & Wind Status -->
                <div class="flex items-center gap-3">
                    <div id="hud-wind" class="flex items-center gap-1 bg-black/10 px-2 py-0.5 rounded text-[11px]">
                        <span>WIND:</span>
                        <i id="wind-icon" class="fa-solid fa-arrow-right"></i>
                        <span id="wind-speed">0</span>
                    </div>
                    <div id="hud-combo" class="hidden sm:block text-amber-700 font-bold text-xs opacity-0 transition-opacity">
                        <span id="combo-count">0</span>x COMBO!
                    </div>
                </div>

                <!-- High Score & Lives -->
                <div class="flex gap-4 items-center">
                    <div class="hidden sm:flex flex-col text-right">
                        <span class="text-[10px] opacity-70">BEST</span>
                        <span id="hud-highscore" class="text-xs sm:text-sm">00000</span>
                    </div>
                    <!-- Lives Display -->
                    <div class="flex flex-col items-end">
                        <span class="text-[10px] opacity-70">MISSES</span>
                        <div id="hud-lives" class="flex gap-1 text-red-600 text-sm sm:text-base">
                            <i class="fa-solid fa-xmark opacity-20"></i>
                            <i class="fa-solid fa-xmark opacity-20"></i>
                            <i class="fa-solid fa-xmark opacity-20"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Canvas Element -->
            <div class="relative flex-1 w-full h-full rounded-xl overflow-hidden bg-emerald-100/30">
                <canvas id="gameCanvas" class="w-full h-full block cursor-pointer"></canvas>

                <!-- Start / Game Over Modal Overlay -->
                <div id="overlay-screen" class="absolute inset-0 z-30 bg-black/75 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center text-white">
                    
                    <!-- Title Screen Content -->
                    <div id="title-modal" class="flex flex-col items-center space-y-4 max-w-md">
                        <div class="w-20 h-20 bg-amber-500/20 rounded-full flex items-center justify-center border-2 border-amber-400 mb-2">
                            <i class="fa-solid fa-parachute-box text-4xl text-amber-400 animate-bounce"></i>
                        </div>
                        <h2 class="font-pixel text-xl sm:text-2xl text-amber-400 leading-relaxed">PARACHUTE<br><span class="text-cyan-400">RESCUE</span></h2>
                        <p class="text-xs sm:text-sm text-slate-300 leading-relaxed">
                            ヘリコプターから降下する兵士をボートでキャッチ！<br>
                            サメに気をつけて海に落ちる前に救出しよう。
                        </p>

                        <!-- Difficulty Selection -->
                        <div class="w-full my-2">
                            <label class="block text-xs text-slate-400 mb-1">難易度選択 (DIFFICULTY)</label>
                            <div class="grid grid-cols-3 gap-2">
                                <button data-diff="easy" class="diff-btn py-1.5 px-2 bg-slate-800 rounded border border-slate-600 text-xs hover:border-emerald-400">EASY</button>
                                <button data-diff="normal" class="diff-btn py-1.5 px-2 bg-amber-600/80 rounded border-2 border-amber-400 text-xs font-bold">NORMAL</button>
                                <button data-diff="hard" class="diff-btn py-1.5 px-2 bg-slate-800 rounded border border-slate-600 text-xs hover:border-red-400">HARD</button>
                            </div>
                        </div>

                        <button id="btn-start" class="btn-arcade w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-pixel text-sm rounded-xl font-bold uppercase tracking-wider transition">
                            GAME START <i class="fa-solid fa-play ml-2"></i>
                        </button>
                    </div>

                    <!-- Game Over Content -->
                    <div id="gameover-modal" class="hidden flex-col items-center space-y-4 max-w-md">
                        <div class="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center border border-red-500 mb-1">
                            <i class="fa-solid fa-skull text-3xl text-red-500"></i>
                        </div>
                        <h2 class="font-pixel text-2xl text-red-500">GAME OVER</h2>
                        
                        <div class="bg-slate-900/90 border border-slate-700 rounded-xl p-4 w-full space-y-2 text-sm">
                            <div class="flex justify-between">
                                <span class="text-slate-400">FINAL SCORE:</span>
                                <span id="final-score" class="font-pixel text-amber-400 text-base">0</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-slate-400">RESCUED:</span>
                                <span id="final-rescued" class="font-bold text-cyan-400">0 人</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-slate-400">HIGH SCORE:</span>
                                <span id="final-highscore" class="font-pixel text-emerald-400">0</span>
                            </div>
                        </div>

                        <button id="btn-restart" class="btn-arcade w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-pixel text-sm rounded-xl font-bold uppercase tracking-wider transition">
                            TRY AGAIN <i class="fa-solid fa-rotate-right ml-2"></i>
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- On-Screen Mobile Controls Footer -->
    <footer class="w-full max-w-4xl grid grid-cols-2 gap-3 px-2 mb-1">
        <button id="btn-left" class="btn-arcade py-3 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 border border-slate-600/80 rounded-xl flex items-center justify-center text-amber-400 text-2xl">
            <i class="fa-solid fa-caret-left mr-2"></i> LEFT [ &larr; / A ]
        </button>
        <button id="btn-right" class="btn-arcade py-3 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 border border-slate-600/80 rounded-xl flex items-center justify-center text-amber-400 text-2xl">
            RIGHT [ &rarr; / D ] <i class="fa-solid fa-caret-right ml-2"></i>
        </button>
    </footer>

    <script>
        class SoundEngine {
            constructor() {
                this.muted = false;
                this.initialized = false;
            }

            async init() {
                if (this.initialized) return;
                try {
                    await Tone.start();
                    
                    // Synthesizer for retro beep sound effects
                    this.synth = new Tone.Synth({
                        oscillator: { type: 'square' },
                        envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.1 }
                    }).toDestination();
                    this.synth.volume.value = -12;

                    // Noise Synth for water splashes & wind
                    this.noiseSynth = new Tone.NoiseSynth({
                        noise: { type: 'white' },
                        envelope: { attack: 0.005, decay: 0.2, sustain: 0 }
                    }).toDestination();
                    this.noiseSynth.volume.value = -18;

                    // PolySynth for victory chords & combos
                    this.polySynth = new Tone.PolySynth(Tone.Synth).toDestination();
                    this.polySynth.volume.value = -14;

                    this.initialized = true;
                } catch(e) {
                    console.log("Audio Context Error:", e);
                }
            }

            playCatch(combo = 1) {
                if (this.muted || !this.initialized) return;
                try {
                    const baseFreq = 440;
                    const freq = baseFreq + Math.min(combo, 10) * 60;
                    this.synth.triggerAttackRelease(freq, "8n", Tone.now() + 0.01);
                } catch(e) {
                    console.warn("Audio play catch error:", e);
                }
            }

            playDrop() {
                if (this.muted || !this.initialized) return;
                try {
                    this.synth.triggerAttackRelease("C3", "16n", Tone.now() + 0.01);
                } catch(e) {
                    console.warn("Audio play drop error:", e);
                }
            }

            playSplash() {
                if (this.muted || !this.initialized) return;
                try {
                    this.noiseSynth.triggerAttackRelease("16n", Tone.now() + 0.01);
                } catch(e) {
                    console.warn("Audio splash error:", e);
                }
            }

            playGameOver() {
                if (this.muted || !this.initialized) return;
                try {
                    // Use PolySynth with buffer offset to prevent start time overlap errors
                    const now = Tone.now() + 0.05;
                    const synth = this.polySynth || this.synth;
                    synth.triggerAttackRelease("G3", "8n", now);
                    synth.triggerAttackRelease("E3", "8n", now + 0.15);
                    synth.triggerAttackRelease("C3", "4n", now + 0.3);
                } catch(e) {
                    console.warn("Audio game over error:", e);
                }
            }

            playWind() {
                if (this.muted || !this.initialized) return;
                try {
                    this.noiseSynth.triggerAttackRelease("8n", Tone.now() + 0.01);
                } catch(e) {
                    console.warn("Audio wind error:", e);
                }
            }
        }

        const audio = new SoundEngine();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // State Machine
        const GameState = { TITLE: 'title', PLAYING: 'playing', PAUSED: 'paused', GAMEOVER: 'gameover' };
        let currentState = GameState.TITLE;

        // Visual Themes
        const Themes = {
            LCD: {
                name: 'LCD Mode',
                frameBg: 'bg-amber-100 border-amber-600/40',
                skyTop: '#c2d2b5',
                skyBottom: '#a2b893',
                ocean: '#7a966d',
                ink: '#1a2615',
                inkLight: 'rgba(26, 38, 21, 0.15)',
                accent: '#384d2e',
                heliColor: '#1a2615',
                boatColor: '#1a2615',
                chuteColor: '#1a2615'
            },
            NEON: {
                name: 'Neon Mode',
                frameBg: 'bg-slate-900 border-cyan-500/50',
                skyTop: '#0d1b2a',
                skyBottom: '#1b263b',
                ocean: '#0077b6',
                ink: '#00f5d4',
                inkLight: 'rgba(0, 245, 212, 0.15)',
                accent: '#ff007f',
                heliColor: '#f72585',
                boatColor: '#4cc9f0',
                chuteColor: '#7209b7'
            }
        };
        let currentTheme = Themes.LCD;

        // Game Configuration
        let config = {
            difficulty: 'normal',
            spawnInterval: 180, // frames
            maxLives: 3,
            boatLanes: 5, // 5 lane positions for boat
        };

        // Gameplay Variables
        let score = 0;
        let highScore = parseInt(localStorage.getItem('parachute_highscore') || '0');
        let rescuedCount = 0;
        let combo = 0;
        let lives = config.maxLives;
        let frameCount = 0;
        let wind = 0; // -2 to +2 horizontal drift force
        let stage = 1; // 10 stages
        let speedBoostTimer = 0; // 10秒間のスピードブースト
        let baseSpeedMultiplier = 1.0;

        // Game Entities
        let boat = { lane: 2, targetX: 0, currentX: 0, y: 0, width: 70, height: 26 };
        let parachutists = [];
        let helicopter = { x: 0, y: 35, width: 64, height: 28, dir: 1, speed: 2 };
        let sharks = [];
        let particles = [];
        let palmTree = { x: 0, y: 0 };

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;

            // Align Boat & Heli Y positions relative to dynamic canvas height
            boat.y = canvas.height - 45;
            helicopter.y = Math.min(50, canvas.height * 0.12);
            palmTree.x = canvas.width - 40;
            palmTree.y = canvas.height - 70;
            
            updateBoatPosition(true);
        }

        window.addEventListener('resize', resizeCanvas);

        function getLaneX(laneIndex) {
            const padding = 60;
            const usableWidth = canvas.width - (padding * 2);
            const step = usableWidth / (config.boatLanes - 1);
            return padding + (laneIndex * step);
        }

        function updateBoatPosition(instant = false) {
            boat.targetX = getLaneX(boat.lane);
            if (instant) {
                boat.currentX = boat.targetX;
            }
        }

        function moveBoat(direction) {
            if (currentState !== GameState.PLAYING) return;
            if (direction === -1 && boat.lane > 0) {
                boat.lane--;
            } else if (direction === 1 && boat.lane < config.boatLanes - 1) {
                boat.lane++;
            }
            updateBoatPosition();
        }

        // Input Listeners
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveBoat(-1);
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveBoat(1);
            if (e.key === ' ' && currentState === GameState.PLAYING) togglePause();
        });

        document.getElementById('btn-left').addEventListener('click', () => moveBoat(-1));
        document.getElementById('btn-right').addEventListener('click', () => moveBoat(1));

        // Touch/Click on canvas left/right halves
        canvas.addEventListener('pointerdown', (e) => {
            if (currentState !== GameState.PLAYING) return;
            const rect = canvas.getBoundingClientRect();
            const touchX = e.clientX - rect.left;
            if (touchX < canvas.width / 2) {
                moveBoat(-1);
            } else {
                moveBoat(1);
            }
        });

        class Parachutist {
            constructor(x, y, type = 'human') {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = (1.2 + Math.random() * 0.5) * baseSpeedMultiplier;
                this.size = 12;
                this.state = 'falling'; // 'falling', 'caught', 'missed'
                this.parachuteOpened = true;
                this.stuckOnTree = false;
                this.id = Math.random();
                this.type = type; // 'human', 'elephant', 'giraffe', 'crocodile'
            }

            update() {
                if (this.state === 'falling') {
                    // Wind drift
                    this.x += wind * 0.3;
                    this.y += this.vy * baseSpeedMultiplier;

                    // Keep inside canvas bounds horizontally
                    if (this.x < 20) this.x = 20;
                    if (this.x > canvas.width - 20) this.x = canvas.width - 20;

                    // Check Palm Tree Hazard (Far Right)
                    if (this.x > canvas.width - 60 && this.y > palmTree.y - 20 && this.y < palmTree.y + 10 && !this.stuckOnTree) {
                        if (Math.random() < 0.3) {
                            this.stuckOnTree = true;
                            this.vy = 0;
                            // Drop after delay
                            setTimeout(() => {
                                this.stuckOnTree = false;
                                this.vy = 2.5; // Drop fast from tree
                            }, 1500);
                        }
                    }

                    // Check Catch by Boat
                    const catchZoneY = boat.y - 15;
                    if (this.y >= catchZoneY && this.y <= boat.y + 10) {
                        if (Math.abs(this.x - boat.currentX) < boat.width / 2 + 10) {
                            this.catchSuccess();
                        }
                    }

                    // Check Water Hit (Miss)
                    if (this.y >= canvas.height - 30) {
                        this.missed();
                    }
                }
            }

            catchSuccess() {
                this.state = 'caught';
                combo++;
                const pts = 100 * combo;
                score += pts;
                rescuedCount++;

                audio.playCatch(combo);
                createParticles(this.x, this.y, currentTheme.ink, 8);
                showFloatingText(`+${pts}`, this.x, this.y - 15);

                // Flash combo HUD
                const comboEl = document.getElementById('hud-combo');
                document.getElementById('combo-count').innerText = combo;
                comboEl.classList.remove('opacity-0');
                setTimeout(() => { if (combo < 2) comboEl.classList.add('opacity-0'); }, 1500);

                updateHUD();
            }

            missed() {
                this.state = 'missed';
                combo = 0;
                lives--;

                audio.playSplash();
                audio.playDrop();

                // Spawn Shark at miss location
                sharks.push(new Shark(this.x, canvas.height - 25));
                createParticles(this.x, canvas.height - 25, '#3b82f6', 10);

                document.getElementById('hud-combo').classList.add('opacity-0');
                updateHUD();

                if (lives <= 0) {
                    triggerGameOver();
                }
            }
        }

        class Shark {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.life = 60; // frame duration
                this.mouthOpen = 0;
            }

            update() {
                this.life--;
                this.mouthOpen = Math.sin(this.life * 0.2) * 10;
            }

            draw() {
                ctx.save();
                ctx.fillStyle = currentTheme === Themes.LCD ? currentTheme.ink : '#ef4444';
                
                // Shark Fin & Snout
                ctx.beginPath();
                ctx.moveTo(this.x - 15, this.y + 10);
                ctx.lineTo(this.x, this.y - 12);
                ctx.lineTo(this.x + 10, this.y + 10);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }
        }

        function createParticles(x, y, color, count = 6) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    life: 25,
                    color: color
                });
            }
        }

        let floatingTexts = [];
        function showFloatingText(text, x, y) {
            floatingTexts.push({ text, x, y, opacity: 1.0, life: 30 });
        }

        function drawHelicopter() {
            helicopter.x += helicopter.speed * helicopter.dir;

            // Turn around at edges
            if (helicopter.x > canvas.width - 60) {
                helicopter.dir = -1;
            } else if (helicopter.x < 60) {
                helicopter.dir = 1;
            }

            ctx.save();
            ctx.translate(helicopter.x, helicopter.y);
            if (helicopter.dir === -1) ctx.scale(-1, 1);

            ctx.fillStyle = currentTheme.heliColor;

            // Heli Body
            ctx.fillRect(-20, -10, 40, 20);
            // Heli Tail
            ctx.fillRect(-35, -4, 20, 6);
            ctx.fillRect(-38, -10, 4, 12);

            // Rotor Blade (Animation)
            ctx.fillRect(-28, -14, 56, 3);
            if (Math.floor(frameCount / 2) % 2 === 0) {
                ctx.fillRect(-20, -15, 40, 2);
            }

            ctx.restore();
        }

        function drawBoat() {
            // Smooth lerp to target position
            boat.currentX += (boat.targetX - boat.currentX) * 0.25;

            ctx.save();
            ctx.translate(boat.currentX, boat.y);

            ctx.fillStyle = currentTheme.boatColor;
            
            // Boat Hull
            ctx.beginPath();
            ctx.moveTo(-boat.width / 2, -5);
            ctx.lineTo(boat.width / 2, -5);
            ctx.lineTo(boat.width / 2 - 10, boat.height / 2);
            ctx.lineTo(-boat.width / 2 + 10, boat.height / 2);
            ctx.closePath();
            ctx.fill();

            // Rescuer Figure on Boat
            ctx.fillRect(-6, -16, 12, 12);
            ctx.beginPath();
            ctx.arc(0, -20, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawParachute(offsetY = -18) {
            ctx.fillStyle = currentTheme.chuteColor;
            ctx.beginPath();
            ctx.arc(0, offsetY, 14, Math.PI, 0, false);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = currentTheme.ink;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-14, offsetY);
            ctx.lineTo(0, offsetY + 16);
            ctx.moveTo(14, offsetY);
            ctx.lineTo(0, offsetY + 16);
            ctx.stroke();
        }

        function drawHuman(p) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.fillStyle = currentTheme.ink;
            drawParachute(-18);
            ctx.fillRect(-3, -2, 6, 10);
            ctx.beginPath();
            ctx.arc(0, -5, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(-6, 0, 12, 2.5);
            ctx.fillRect(-4, 8, 3, 6);
            ctx.fillRect(1, 8, 3, 6);
            ctx.restore();
        }

        function drawElephant(p) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.fillStyle = currentTheme.ink;
            drawParachute(-20);
            ctx.fillRect(-6, -4, 12, 12);
            ctx.beginPath();
            ctx.arc(-3, -6, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(3, -6, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(-1, 2, 2, 8);
            ctx.fillRect(3, 2, 2, 8);
            ctx.fillRect(-7, 4, 2, 6);
            ctx.fillRect(9, 4, 2, 6);
            ctx.fillRect(-2, 8, 4, 6);
            ctx.restore();
        }

        function drawGiraffe(p) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.fillStyle = currentTheme.ink;
            drawParachute(-26);
            ctx.fillRect(-4, 2, 8, 10);
            ctx.fillRect(-2, -10, 4, 14);
            ctx.beginPath();
            ctx.arc(0, -12, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(-4, 10, 2, 6);
            ctx.fillRect(4, 10, 2, 6);
            ctx.fillRect(-1, 12, 2, 6);
            ctx.fillRect(3, 12, 2, 6);
            ctx.restore();
        }

        function drawCrocodile(p) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.fillStyle = currentTheme.ink;
            drawParachute(-18);
            ctx.fillRect(-7, -2, 14, 6);
            ctx.beginPath();
            ctx.arc(-5, -3, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(5, -3, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(-6, 4, 2, 5);
            ctx.fillRect(-2, 4, 2, 5);
            ctx.fillRect(2, 4, 2, 5);
            ctx.fillRect(6, 4, 2, 5);
            ctx.restore();
        }

        function drawParachutist(p) {
            if (p.type === 'human') drawHuman(p);
            else if (p.type === 'elephant') drawElephant(p);
            else if (p.type === 'giraffe') drawGiraffe(p);
            else if (p.type === 'crocodile') drawCrocodile(p);
            else drawHuman(p);
        }

        function drawScenery() {
            // Background Clear / Sky
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, currentTheme.skyTop);
            gradient.addColorStop(0.8, currentTheme.skyBottom);
            gradient.addColorStop(1, currentTheme.ocean);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Ocean Wave Line
            ctx.fillStyle = currentTheme.ocean;
            ctx.fillRect(0, canvas.height - 35, canvas.width, 35);

            // Wave Details
            ctx.strokeStyle = currentTheme.inkLight;
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let x = 0; x < canvas.width; x += 30) {
                const waveY = canvas.height - 30 + Math.sin((x + frameCount * 2) * 0.05) * 3;
                if (x === 0) ctx.moveTo(x, waveY);
                else ctx.lineTo(x, waveY);
            }
            ctx.stroke();

            // Palm Tree on Far Right
            ctx.fillStyle = currentTheme.ink;
            ctx.fillRect(palmTree.x, palmTree.y, 8, 40); // Trunk
            // Leaves
            ctx.beginPath();
            ctx.arc(palmTree.x + 4, palmTree.y, 22, Math.PI, 0, false);
            ctx.fill();
        }

        function updateGame() {
            if (currentState !== GameState.PLAYING) return;

            frameCount++;

            // Speed Boost: 30秒ごとに10秒間スピード2倍
            if (frameCount % 1800 === 0) { // 30秒 × 60fps
                speedBoostTimer = 600; // 10秒 × 60fps
                audio.playCatch(3);
            }
            if (speedBoostTimer > 0) {
                speedBoostTimer--;
                baseSpeedMultiplier = 2.0;
            } else {
                baseSpeedMultiplier = 1.0;
            }

            // Stage Progression: 50救出ごとに面を進める
            const newStage = Math.floor(rescuedCount / 50) + 1;
            if (newStage !== stage && newStage <= 10) {
                stage = newStage;
                config.spawnInterval = Math.max(70, 170 - (stage * 10));
            }

            // Periodically change Wind (面が上がるほど頻繁・強化)
            if (frameCount % Math.max(200, 300 - stage * 20) === 0) {
                wind = Math.floor(Math.random() * (5 + stage)) - Math.floor((5 + stage) / 2);
                wind = Math.max(-3, Math.min(3, wind));
                updateWindHUD();
                if (wind !== 0) audio.playWind();
            }

            // Spawn Parachutist from Helicopter (ステージに応じて動物切り替え)
            if (frameCount % config.spawnInterval === 0) {
                const spawnX = Math.max(40, Math.min(canvas.width - 40, helicopter.x));
                let charType = 'human';
                if (stage >= 3) charType = ['human', 'elephant'][Math.floor(Math.random() * 2)];
                if (stage >= 6) charType = ['human', 'elephant', 'giraffe', 'crocodile'][Math.floor(Math.random() * 4)];
                parachutists.push(new Parachutist(spawnX, helicopter.y + 15, charType));
            }

            // Gradually increase difficulty speed over time
            if (frameCount % 600 === 0 && config.spawnInterval > 70) {
                config.spawnInterval -= 10;
            }

            // Update Parachutists
            for (let i = parachutists.length - 1; i >= 0; i--) {
                const p = parachutists[i];
                p.update();
                if (p.state !== 'falling') {
                    parachutists.splice(i, 1);
                }
            }

            // Update Sharks
            for (let i = sharks.length - 1; i >= 0; i--) {
                sharks[i].update();
                if (sharks[i].life <= 0) sharks.splice(i, 1);
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.life--;
                if (pt.life <= 0) particles.splice(i, 1);
            }

            // Update Floating Text
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y -= 0.8;
                ft.opacity -= 0.03;
                ft.life--;
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }
        }

        function renderGame() {
            // Clear & Render Base
            drawScenery();

            // Render Entities
            drawHelicopter();
            drawBoat();

            // Draw Parachutists
            parachutists.forEach(p => drawParachutist(p));

            // Draw Sharks
            sharks.forEach(s => s.draw());

            // Draw Particles
            particles.forEach(pt => {
                ctx.fillStyle = pt.color;
                ctx.fillRect(pt.x, pt.y, 3, 3);
            });

            // Draw Floating Text
            floatingTexts.forEach(ft => {
                ctx.save();
                ctx.fillStyle = currentTheme.ink;
                ctx.font = 'bold 12px "Press Start 2P", monospace';
                ctx.globalAlpha = Math.max(0, ft.opacity);
                ctx.fillText(ft.text, ft.x - 15, ft.y);
                ctx.restore();
            });
        }

        function gameLoop() {
            updateGame();
            renderGame();
            requestAnimationFrame(gameLoop);
        }

        function updateHUD() {
            document.getElementById('hud-score').innerText = String(score).padStart(5, '0');
            document.getElementById('hud-highscore').innerText = String(highScore).padStart(5, '0');

            // Lives UI (3 Crosses)
            const livesContainer = document.getElementById('hud-lives');
            livesContainer.innerHTML = '';
            for (let i = 0; i < config.maxLives; i++) {
                const icon = document.createElement('i');
                icon.className = 'fa-solid fa-xmark transition-opacity duration-300';
                if (i >= lives) {
                    icon.classList.add('text-red-600', 'opacity-100'); // Miss marker
                } else {
                    icon.classList.add('opacity-20');
                }
                livesContainer.appendChild(icon);
            }
        }

        function updateWindHUD() {
            const windIcon = document.getElementById('wind-icon');
            const windSpeed = document.getElementById('wind-speed');

            windSpeed.innerText = Math.abs(wind);
            if (wind === 0) {
                windIcon.className = 'fa-solid fa-minus';
            } else if (wind > 0) {
                windIcon.className = 'fa-solid fa-arrow-right text-cyan-500';
            } else {
                windIcon.className = 'fa-solid fa-arrow-left text-amber-500';
            }
        }

        function startGame() {
            audio.init();

            // Set Difficulty
            if (config.difficulty === 'easy') config.spawnInterval = 210;
            else if (config.difficulty === 'normal') config.spawnInterval = 170;
            else if (config.difficulty === 'hard') config.spawnInterval = 120;

            // Reset Game Variables
            score = 0;
            lives = config.maxLives;
            rescuedCount = 0;
            combo = 0;
            frameCount = 0;
            wind = 0;
            stage = 1;
            speedBoostTimer = 0;
            baseSpeedMultiplier = 1.0;
            parachutists = [];
            sharks = [];
            particles = [];
            boat.lane = 2;

            updateBoatPosition(true);
            updateHUD();
            updateWindHUD();

            currentState = GameState.PLAYING;
            document.getElementById('overlay-screen').classList.add('hidden');
        }

        function triggerGameOver() {
            // Guard against duplicate triggers on the same frame
            if (currentState === GameState.GAMEOVER) return;

            currentState = GameState.GAMEOVER;
            audio.playGameOver();

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('parachute_highscore', highScore.toString());
            }

            document.getElementById('final-score').innerText = score;
            document.getElementById('final-rescued').innerText = `${rescuedCount} 人`;
            document.getElementById('final-highscore').innerText = highScore;

            document.getElementById('title-modal').classList.add('hidden');
            document.getElementById('gameover-modal').classList.remove('hidden');
            document.getElementById('gameover-modal').classList.add('flex');
            document.getElementById('overlay-screen').classList.remove('hidden');
        }

        function togglePause() {
            if (currentState === GameState.PLAYING) {
                currentState = GameState.PAUSED;
                document.getElementById('btn-pause').innerHTML = '<i class="fa-solid fa-play text-emerald-400"></i>';
            } else if (currentState === GameState.PAUSED) {
                currentState = GameState.PLAYING;
                document.getElementById('btn-pause').innerHTML = '<i class="fa-solid fa-pause text-amber-400"></i>';
            }
        }

        document.getElementById('btn-theme').addEventListener('click', () => {
            const frame = document.getElementById('game-frame');
            const label = document.getElementById('theme-label');
            const scanlines = document.getElementById('scanlines');

            if (currentTheme === Themes.LCD) {
                currentTheme = Themes.NEON;
                frame.className = `relative w-full h-full max-h-[680px] p-2 md:p-4 rounded-2xl border-4 lcd-screen overflow-hidden flex flex-col ${Themes.NEON.frameBg}`;
                label.innerText = 'Neon Mode';
                scanlines.style.opacity = '0.15';
            } else {
                currentTheme = Themes.LCD;
                frame.className = `relative w-full h-full max-h-[680px] p-2 md:p-4 rounded-2xl border-4 lcd-screen overflow-hidden flex flex-col ${Themes.LCD.frameBg}`;
                label.innerText = 'LCD Mode';
                scanlines.style.opacity = '0.35';
            }
        });

        document.getElementById('btn-sound').addEventListener('click', () => {
            audio.muted = !audio.muted;
            const icon = document.getElementById('sound-icon');
            if (audio.muted) {
                icon.className = 'fa-solid fa-volume-xmark text-slate-500';
            } else {
                icon.className = 'fa-solid fa-volume-high text-emerald-400';
            }
        });

        document.getElementById('btn-pause').addEventListener('click', togglePause);
        document.getElementById('btn-start').addEventListener('click', startGame);
        document.getElementById('btn-restart').addEventListener('click', () => {
            document.getElementById('gameover-modal').classList.add('hidden');
            document.getElementById('gameover-modal').classList.remove('flex');
            document.getElementById('title-modal').classList.remove('hidden');
            startGame();
        });

        // Difficulty Buttons
        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.diff-btn').forEach(b => {
                    b.className = 'diff-btn py-1.5 px-2 bg-slate-800 rounded border border-slate-600 text-xs';
                });
                e.target.className = 'diff-btn py-1.5 px-2 bg-amber-600/80 rounded border-2 border-amber-400 text-xs font-bold';
                config.difficulty = e.target.dataset.diff;
            });
        });

        window.onload = () => {
            resizeCanvas();
            updateHUD();
            gameLoop();
        };
    </script>
</body>
</html>
