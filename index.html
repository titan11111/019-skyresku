<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Stray Cat Fall - Galaxy Mission</title>
    <style>
        :root {
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* 全体でのスクロール無効化 */
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; /* iOSのアドレスバー対策 */
            background: #0f2027;
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 500px; /* 少し幅を広げる */
            aspect-ratio: 9/19; /* 最近のスマホに近い縦長比率 */
            max-height: 100dvh;
            background: #87CEEB;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        /* PC等で画面が広い場合のみ角丸とマージンを適用 */
        @media (min-width: 501px) {
            #gameContainer {
                height: 95dvh;
                border-radius: 24px;
            }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- UI Overlay --- */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(15, 32, 39, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: opacity 0.4s ease;
            z-index: 50;
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Panel Styling */
        .panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.4);
            width: 85%;
            max-width: 320px;
            transform: translateY(0);
            animation: floatPanel 4s ease-in-out infinite;
        }

        @keyframes floatPanel {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .title {
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(45deg, #FF6B9D, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
            letter-spacing: -1px;
        }

        .catIcon {
            font-size: 80px;
            margin: 15px 0;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.15));
            animation: catBounce 2s infinite;
        }
        @keyframes catBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1) rotate(5deg); }
        }

        .btn {
            background: linear-gradient(135deg, #FF6B9D, #FF8E53);
            border: none;
            border-radius: 50px;
            padding: 16px 0;
            width: 100%;
            font-size: 20px;
            font-weight: 800;
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 107, 157, 0.4);
            transition: transform 0.1s, filter 0.1s;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(255,255,255,0.4), transparent);
            opacity: 0;
        }
        .btn:active {
            transform: scale(0.96);
            filter: brightness(1.1);
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            font-weight: bold;
            color: #555;
            border-bottom: 2px dashed #eee;
            padding-bottom: 5px;
        }
        .score-val {
            font-size: 24px;
            color: #333;
            font-family: 'Courier New', monospace;
        }

        /* HUD */
        #hud {
            position: absolute;
            top: max(10px, env(safe-area-inset-top));
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none;
        }

        .hud-pill {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* Controls - 操作性向上のための大幅レイアウト変更 */
        #controls-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 160px; /* タッチ領域を広く確保 */
            z-index: 20;
            padding-bottom: var(--safe-bottom);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding-left: 20px;
            padding-right: 20px;
            pointer-events: none; /* レイヤー自体は透過 */
        }

        .control-area {
            pointer-events: auto; /* ボタン部分は操作可能 */
            position: relative;
            width: 90px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ボタンの見た目 */
        .c-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 28px;
            transition: all 0.1s cubic-bezier(0.1, 0.7, 1.0, 0.1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* 実際のタッチ判定領域（透明で大きくする） */
        .c-hitbox {
            position: absolute;
            top: -20px; left: -20px; right: -20px; bottom: -20px;
            border-radius: 50%;
            /* background: rgba(255,0,0,0.2); デバッグ用 */
        }

        .c-btn.active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.9) translateY(4px);
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255,255,255,0.6);
        }

        /* 左右ボタンのグループ */
        .d-pad {
            display: flex;
            gap: 20px; /* 間隔を調整 */
            pointer-events: none;
        }
        .d-pad .control-area {
            pointer-events: auto;
        }

        /* フワッとボタン（右側） */
        .float-btn .c-btn {
            width: 85px;
            height: 85px;
            background: rgba(255, 215, 0, 0.2);
            border-color: rgba(255, 215, 0, 0.6);
            font-size: 36px;
        }
        .float-btn .c-btn.active {
            background: rgba(255, 215, 0, 0.6);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        }

        /* クリア画面の特別装飾 */
        .clear-theme .panel {
            border: 4px solid #FFD700;
        }
        .clear-theme .title {
            background: linear-gradient(to right, #FFD700, #FFA500);
            -webkit-background-clip: text;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <div id="hud" class="hidden">
        <div class="hud-pill">🌟 <span id="starCount">0</span></div>
        <div class="hud-pill">📏 <span id="depth">0</span>m</div>
        <div class="hud-pill" style="background:rgba(255,69,157,0.6);">🏁 10000m</div>
    </div>

    <div id="controls-layer" class="hidden">
        <div class="d-pad">
            <div class="control-area" id="areaLeft">
                <div class="c-hitbox"></div>
                <div class="c-btn" id="btnLeft">◀</div>
            </div>
            <div class="control-area" id="areaRight">
                <div class="c-hitbox"></div>
                <div class="c-btn" id="btnRight">▶</div>
            </div>
        </div>
        
        <div class="control-area float-btn" id="areaFloat">
            <div class="c-hitbox" style="top:-30px; left:-30px; right:-30px; bottom:-30px;"></div>
            <div class="c-btn" id="btnFloat">🎈</div>
        </div>
    </div>

    <div id="startScreen" class="screen">
        <div class="panel">
            <div style="font-size: 12px; letter-spacing: 2px; color:#888;">GALAXY MISSION</div>
            <div class="title">Stray Cat<br>Fall</div>
            <div class="catIcon">🐱🚀</div>
            <div class="score-row">
                <span>GOAL</span>
                <span class="score-val" style="color:#FF6B9D;">10,000m</span>
            </div>
            <div class="score-row">
                <span>BEST</span>
                <span class="score-val" id="startBest">0m</span>
            </div>
            <button class="btn" id="startBtn">START MISSION</button>
        </div>
    </div>

    <div id="resultScreen" class="screen hidden">
        <div class="panel">
            <div class="title" style="font-size: 28px; background: #666; -webkit-background-clip: text;">GAME OVER</div>
            <div class="catIcon">💫🙀</div>
            <div class="score-row">
                <span>DEPTH</span>
                <span class="score-val" id="resultDepth">0m</span>
            </div>
            <div class="score-row">
                <span>STARS</span>
                <span class="score-val" id="resultStars">0</span>
            </div>
            <div id="newRecord" style="display:none; color:#FF6B9D; font-weight:900; animation:pulse 0.5s infinite;">🎉 NEW RECORD! 🎉</div>
            <button class="btn" id="retryBtn">RETRY</button>
        </div>
    </div>

    <div id="clearScreen" class="screen hidden clear-theme">
        <div class="panel">
            <div class="title">MISSION<br>COMPLETE!</div>
            <div class="catIcon">😻🌎</div>
            <div style="margin:10px 0; font-weight:bold; color:#d35400;">地表に到達しました！</div>
            <div class="score-row">
                <span>SCORE</span>
                <span class="score-val" id="clearScore">10000m</span>
            </div>
            <div class="score-row">
                <span>STARS</span>
                <span class="score-val" id="clearStars">0</span>
            </div>
            <button class="btn" id="clearRetryBtn" style="background: linear-gradient(135deg, #FFD700, #F39C12);">PLAY AGAIN</button>
        </div>
    </div>
</div>

<script>
/**
 * Stray Cat Fall - Enhanced Edition
 * Improved for iOS, Responsive Layout, and better Game Feel.
 */

// --- Game Configuration ---
const CONFIG = {
    CAT_SIZE: 44,          // 少し大きくして視認性アップ
    GRAVITY: 0.18,         // 重力を少し強くしてキビキビさせる
    FLOAT_POWER: 0.45,     // 浮力を調整
    MOVE_ACCEL: 0.8,       // 加速度を上げてレスポンス向上 (0.4 -> 0.8)
    MOVE_FRICTION: 0.82,   // 摩擦を少し強めて「止まりやすく」する
    MAX_HSPEED: 8,         // 横移動の最高速
    MAX_VSPEED: 9,         // 落下最高速
    
    SPAWN_INTERVAL_BASE: 1800,
    SPAWN_INTERVAL_MIN: 800,
    GOAL_DEPTH: 10000,
    
    // 画面シェイク設定
    SHAKE_DECAY: 0.9,
    
    // ヒット時の演出
    HIT_FREEZE_FRAMES: 4   // 被弾時に一瞬止めてインパクトを出す
};

// --- System Variables ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); // アルファオフで描画パフォーマンス向上
let width, height;

// Game State
let state = 'start'; // start, playing, result, clear
let frame = 0;
let score = 0; // depth
let stars = 0;
let bestScore = parseInt(localStorage.getItem('strayCatBest')) || 0;
let freezeFrame = 0; // ヒットストップ用
let shake = 0;

// Entities
let cat = { x: 0, y: 0, vx: 0, vy: 0, angle: 0, expression: 'normal', timer: 0 };
let obstacles = [];
let items = [];
let particles = [];
let bgStars = [];

// Inputs (Pointer Events for low latency)
const input = { left: false, right: false, float: false };

// Audio Context
let audioCtx = null;
const sounds = {};

// --- Initialization ---

function resize() {
    const container = document.getElementById('gameContainer');
    const rect = container.getBoundingClientRect();
    // デバイスピクセル比を考慮して鮮明に
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    
    width = rect.width;
    height = rect.height;
    
    // Contextのスケール調整
    ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resize);
resize();

// --- Input Handling (Pointer Events) ---
// スマホでの遅延を防ぐため、click/touchstartではなくpointerdownを使用
function setupControl(areaId, btnId, key) {
    const area = document.getElementById(areaId);
    const btn = document.getElementById(btnId);
    
    const handleDown = (e) => {
        if(e.cancelable) e.preventDefault(); // スクロール等の防止
        input[key] = true;
        btn.classList.add('active');
        if(key === 'float') playSound('float');
        
        // バイブレーション（Androidのみ対応、iOSは無視される）
        if(navigator.vibrate) navigator.vibrate(10);
    };
    
    const handleUp = (e) => {
        if(e.cancelable) e.preventDefault();
        input[key] = false;
        btn.classList.remove('active');
    };

    area.addEventListener('pointerdown', handleDown);
    area.addEventListener('pointerup', handleUp);
    area.addEventListener('pointerleave', handleUp);
    area.addEventListener('pointercancel', handleUp);
    
    // iOS Safariでのダブルタップズーム等を防ぐためのリスナー
    area.addEventListener('touchstart', (e) => e.preventDefault(), {passive: false});
}

setupControl('areaLeft', 'btnLeft', 'left');
setupControl('areaRight', 'btnRight', 'right');
setupControl('areaFloat', 'btnFloat', 'float');

// Keyboard Support
window.addEventListener('keydown', e => {
    if(e.key === 'ArrowLeft') { input.left = true; document.getElementById('btnLeft').classList.add('active'); }
    if(e.key === 'ArrowRight') { input.right = true; document.getElementById('btnRight').classList.add('active'); }
    if(e.key === ' ' || e.key === 'ArrowUp') { 
        if(!input.float) playSound('float');
        input.float = true; 
        document.getElementById('btnFloat').classList.add('active'); 
    }
});
window.addEventListener('keyup', e => {
    if(e.key === 'ArrowLeft') { input.left = false; document.getElementById('btnLeft').classList.remove('active'); }
    if(e.key === 'ArrowRight') { input.right = false; document.getElementById('btnRight').classList.remove('active'); }
    if(e.key === ' ' || e.key === 'ArrowUp') { input.float = false; document.getElementById('btnFloat').classList.remove('active'); }
});

// --- Audio ---
function initAudio() {
    if(!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playSound(type) {
    if(!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'float') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, t);
        osc.frequency.linearRampToValueAtTime(440, t + 0.1);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.1);
        osc.start(t); osc.stop(t + 0.1);
    } else if (type === 'get') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, t);
        osc.frequency.exponentialRampToValueAtTime(1760, t + 0.1);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
        osc.start(t); osc.stop(t + 0.2);
    } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, t);
        osc.frequency.exponentialRampToValueAtTime(30, t + 0.2);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.linearRampToValueAtTime(0, t + 0.2);
        osc.start(t); osc.stop(t + 0.2);
    } else if (type === 'clear') {
        osc.type = 'square';
        // Simple fanfare
        [523, 659, 784, 1046].forEach((f, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'triangle';
            o.frequency.value = f;
            g.gain.setValueAtTime(0.1, t + i*0.1);
            g.gain.linearRampToValueAtTime(0, t + i*0.1 + 0.4);
            o.start(t + i*0.1); o.stop(t + i*0.1 + 0.4);
        });
    }
}

// --- Game Logic ---

function resetGame() {
    state = 'playing';
    score = 0;
    stars = 0;
    frame = 0;
    shake = 0;
    freezeFrame = 0;
    
    // Reset Cat
    cat = { x: width/2, y: height * 0.2, vx: 0, vy: 0, angle: 0, expression: 'normal', timer: 0 };
    
    obstacles = [];
    items = [];
    particles = [];
    
    // UI Update
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('resultScreen').classList.add('hidden');
    document.getElementById('clearScreen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('controls-layer').classList.remove('hidden');
}

function update() {
    if (state !== 'playing') return;
    
    // ヒットストップ処理（打感の演出）
    if (freezeFrame > 0) {
        freezeFrame--;
        return;
    }
    
    frame++;

    // --- Movement Physics (Improved) ---
    // 左右同時押しなら減速
    if (input.left && input.right) {
        cat.vx *= 0.8;
    } else if (input.left) {
        cat.vx -= CONFIG.MOVE_ACCEL;
        cat.angle = -15; // 傾き演出
    } else if (input.right) {
        cat.vx += CONFIG.MOVE_ACCEL;
        cat.angle = 15; // 傾き演出
    } else {
        // 入力なしで角度を戻す
        cat.angle *= 0.8;
    }

    // 速度制限と摩擦
    cat.vx = Math.max(-CONFIG.MAX_HSPEED, Math.min(CONFIG.MAX_HSPEED, cat.vx));
    cat.vx *= CONFIG.MOVE_FRICTION;
    
    // 浮遊・落下
    if (input.float) {
        cat.vy -= CONFIG.FLOAT_POWER;
        if(frame % 4 === 0) spawnParticles(cat.x, cat.y + 20, 1, '#fff', 1);
    } else {
        cat.vy += CONFIG.GRAVITY;
    }
    cat.vy = Math.min(cat.vy, CONFIG.MAX_VSPEED);

    // 座標更新
    cat.x += cat.vx;
    cat.y += cat.vy;

    // 壁判定
    if (cat.x < CONFIG.CAT_SIZE/2) { cat.x = CONFIG.CAT_SIZE/2; cat.vx *= -0.5; }
    if (cat.x > width - CONFIG.CAT_SIZE/2) { cat.x = width - CONFIG.CAT_SIZE/2; cat.vx *= -0.5; }

    // スクロール処理
    let scroll = 0;
    const CAMERA_Y = height * 0.35;
    if (cat.y > CAMERA_Y) {
        scroll = cat.y - CAMERA_Y;
        cat.y = CAMERA_Y;
        score += scroll * 0.1; // 進んだ距離
    } else if (cat.y < height * 0.1) {
        // 上に行き過ぎない制限
        cat.y = height * 0.1;
        cat.vy = 0;
    }

    // Goal Check
    if (score >= CONFIG.GOAL_DEPTH) {
        gameClear();
        return;
    }

    // --- Object Management ---
    
    // Spawning
    const currentInterval = Math.max(CONFIG.SPAWN_INTERVAL_MIN, CONFIG.SPAWN_INTERVAL_BASE - score * 0.5);
    if (frame % Math.floor(currentInterval/16) === 0) { // 簡易タイマー
        spawnObstacle();
    }
    if (Math.random() < 0.02) spawnItem();

    // Update Obstacles
    obstacles.forEach((o, i) => {
        o.y -= scroll; // スクロール影響
        o.y -= 2; // 上昇（または猫が落ちる相対速度）
        o.x += Math.sin(frame * 0.05 + o.offset) * 0.5; // ゆらゆら
        
        if (o.y < -50) obstacles.splice(i, 1);
        
        // Collision (Circle-Circle)
        const dx = cat.x - o.x;
        const dy = cat.y - o.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < (CONFIG.CAT_SIZE/2 + o.size/2) * 0.8) {
            gameOver();
        }
    });

    // Update Items
    items.forEach((it, i) => {
        it.y -= scroll;
        it.y -= 2;
        if (it.y < -50) items.splice(i, 1);
        
        const dx = cat.x - it.x;
        const dy = cat.y - it.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < (CONFIG.CAT_SIZE/2 + 15)) {
            // Get Item
            items.splice(i, 1);
            stars++;
            playSound('get');
            spawnParticles(it.x, it.y, 8, '#FFD700', 4);
            cat.expression = 'happy';
            cat.timer = 30;
        }
    });

    // Particles
    particles.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        if(p.life <= 0) particles.splice(i, 1);
    });
    
    // Background Stars (Scroll effect)
    bgStars.forEach(s => {
        s.y -= scroll * s.speed * 0.1;
        if(s.y < 0) { s.y = height; s.x = Math.random() * width; }
    });

    // HUD Update
    document.getElementById('depth').textContent = Math.floor(score);
    document.getElementById('starCount').textContent = stars;
    
    // Shake Decay
    shake *= CONFIG.SHAKE_DECAY;
    if(shake < 0.5) shake = 0;
    
    // Expression reset
    if (cat.timer > 0) {
        cat.timer--;
        if(cat.timer <= 0) cat.expression = 'normal';
    }
}

function spawnObstacle() {
    const size = 30 + Math.random() * 20;
    obstacles.push({
        x: Math.random() * (width - size*2) + size,
        y: height + 50,
        size: size,
        type: Math.random() < 0.5 ? 'cloud' : 'balloon',
        offset: Math.random() * 10
    });
}

function spawnItem() {
    items.push({
        x: Math.random() * (width - 40) + 20,
        y: height + 50
    });
}

function spawnParticles(x, y, count, color, speed) {
    for(let i=0; i<count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = Math.random() * speed;
        particles.push({
            x: x, y: y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            life: 1.0,
            color: color,
            size: Math.random() * 3 + 2
        });
    }
}

// --- Draw ---

function draw() {
    // Clear
    ctx.fillStyle = getBgColor();
    ctx.fillRect(0, 0, width, height);
    
    // Shake Effect
    ctx.save();
    if(shake > 0) {
        ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }
    
    // Draw BG Stars
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    bgStars.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
        ctx.fill();
    });

    // Draw Items
    items.forEach(it => {
        ctx.save();
        ctx.translate(it.x, it.y);
        ctx.fillStyle = '#FFD700';
        // Simple Star shape
        ctx.beginPath();
        for(let i=0; i<5; i++){
            ctx.lineTo(Math.cos((18+i*72)/180*Math.PI)*12, -Math.sin((18+i*72)/180*Math.PI)*12);
            ctx.lineTo(Math.cos((54+i*72)/180*Math.PI)*5, -Math.sin((54+i*72)/180*Math.PI)*5);
        }
        ctx.fill();
        ctx.restore();
    });

    // Draw Obstacles
    obstacles.forEach(o => {
        ctx.save();
        ctx.translate(o.x, o.y);
        if (o.type === 'cloud') {
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.beginPath();
            ctx.arc(0, 0, o.size/2, 0, Math.PI*2);
            ctx.arc(-o.size*0.4, o.size*0.2, o.size*0.3, 0, Math.PI*2);
            ctx.arc(o.size*0.4, o.size*0.2, o.size*0.3, 0, Math.PI*2);
            ctx.fill();
        } else {
            ctx.fillStyle = '#FF6B6B';
            ctx.beginPath();
            ctx.arc(0, 0, o.size/2, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath(); ctx.arc(-o.size*0.15, -o.size*0.15, o.size*0.1, 0, Math.PI*2); ctx.fill();
        }
        ctx.restore();
    });

    // Draw Particles
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    });

    // Draw Cat
    ctx.save();
    ctx.translate(cat.x, cat.y);
    ctx.rotate(cat.angle * Math.PI / 180); // 傾き適用
    
    // Body
    ctx.fillStyle = '#fce4c4';
    ctx.strokeStyle = '#8d6e63';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(0, 0, CONFIG.CAT_SIZE/2, CONFIG.CAT_SIZE/2.2, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();
    
    // Ears
    const earSize = CONFIG.CAT_SIZE * 0.4;
    ctx.beginPath();
    ctx.moveTo(-earSize, -earSize/2);
    ctx.lineTo(-earSize + 5, -earSize*1.5);
    ctx.lineTo(-5, -earSize);
    ctx.fill(); ctx.stroke();
    
    ctx.beginPath();
    ctx.moveTo(earSize, -earSize/2);
    ctx.lineTo(earSize - 5, -earSize*1.5);
    ctx.lineTo(5, -earSize);
    ctx.fill(); ctx.stroke();

    // Face
    ctx.fillStyle = '#333';
    if(cat.expression === 'happy') {
        ctx.font = "20px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("^^", 0, 0);
    } else if (cat.expression === 'surprised') {
        ctx.beginPath(); ctx.arc(-8, -2, 4, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(8, -2, 4, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(0, 8, 3, 5, 0, 0, Math.PI*2); ctx.fill();
    } else {
        ctx.beginPath(); ctx.arc(-8, -2, 3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(8, -2, 3, 0, Math.PI*2); ctx.fill();
    }
    
    ctx.restore();
    ctx.restore();

    requestAnimationFrame(loop);
}

function getBgColor() {
    // 深度に応じて色を変える
    if (score < 2000) return '#87CEEB';
    if (score < 5000) return '#5D4037';
    if (score < 8000) return '#1a237e';
    return '#000000';
}

function loop() {
    update();
    draw();
}

// --- Game Control ---

function gameOver() {
    state = 'result';
    playSound('hit');
    cat.expression = 'surprised';
    shake = 20;
    freezeFrame = CONFIG.HIT_FREEZE_FRAMES; // ヒットストップ
    spawnParticles(cat.x, cat.y, 20, '#ff0000', 8);
    
    if(navigator.vibrate) navigator.vibrate(200);

    // Save Score
    if(score > bestScore) {
        bestScore = Math.floor(score);
        localStorage.setItem('strayCatBest', bestScore);
        document.getElementById('newRecord').style.display = 'block';
    } else {
        document.getElementById('newRecord').style.display = 'none';
    }

    document.getElementById('resultDepth').textContent = Math.floor(score) + "m";
    document.getElementById('resultStars').textContent = stars;
    
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('controls-layer').classList.add('hidden');
    
    // 少し待ってからリザルト表示
    setTimeout(() => {
        document.getElementById('resultScreen').classList.remove('hidden');
    }, 500);
}

function gameClear() {
    state = 'clear';
    playSound('clear');
    cat.expression = 'happy';
    
    if(score > bestScore) {
        bestScore = Math.floor(score);
        localStorage.setItem('strayCatBest', bestScore);
    }

    document.getElementById('clearScore').textContent = Math.floor(score) + "m";
    document.getElementById('clearStars').textContent = stars;
    
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('controls-layer').classList.add('hidden');
    document.getElementById('clearScreen').classList.remove('hidden');
}

// Init BG Stars
for(let i=0; i<50; i++) {
    bgStars.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 2,
        speed: Math.random() * 3 + 1
    });
}

// Button Events
document.getElementById('startBtn').addEventListener('click', () => { initAudio(); resetGame(); });
document.getElementById('retryBtn').addEventListener('click', () => { resetGame(); });
document.getElementById('clearRetryBtn').addEventListener('click', () => { resetGame(); });

document.getElementById('startBest').textContent = bestScore + "m";

// 初回ループ開始
loop();

</script>
