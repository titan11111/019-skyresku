<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🐱 Cosmic Cat Fall - 宇宙猫の大冒険</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- メインゲームコンテナ -->
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <!-- ステージ名表示 -->
        <div id="stageName" class="stage-name hidden"></div>
        
        <!-- HUD -->
        <div id="hud" class="hud hidden">
            <div class="hud-top">
                <div class="hud-stat">
                    <div class="stat-icon">🌍</div>
                    <div class="stat-value" id="depth">0</div>
                    <div class="stat-label">m</div>
                </div>
                <div class="hud-stat">
                    <div class="stat-icon">⭐</div>
                    <div class="stat-value" id="starCount">0</div>
                </div>
                <div class="hud-stat combo" id="comboDisplay" style="display:none;">
                    <div class="stat-icon">🔥</div>
                    <div class="stat-value" id="comboCount">0</div>
                    <div class="stat-label">combo</div>
                </div>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
                <div class="progress-label">目標: 10,000m</div>
            </div>
        </div>

        <!-- コントロール -->
        <div id="controls" class="controls hidden">
            <div class="control-group left">
                <button class="control-btn" id="btnLeft" data-key="left">
                    <span class="btn-icon">◀</span>
                </button>
                <button class="control-btn" id="btnRight" data-key="right">
                    <span class="btn-icon">▶</span>
                </button>
            </div>
            <div class="control-group right">
                <button class="control-btn action" id="btnFloat" data-key="float">
                    <span class="btn-icon">🎈</span>
                </button>
            </div>
        </div>

        <!-- スタート画面 -->
        <div id="startScreen" class="screen">
            <div class="screen-content">
                <div class="game-logo">
                    <div class="logo-icon">🐱🚀</div>
                    <h1>Cosmic Cat Fall</h1>
                    <p class="subtitle">宇宙から地球への壮大な旅</p>
                </div>
                
                <div class="info-card">
                    <div class="info-row">
                        <span class="info-label">GOAL</span>
                        <span class="info-value goal">10,000m</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">BEST</span>
                        <span class="info-value" id="bestScore">0m</span>
                    </div>
                </div>

                <div class="instructions">
                    <h3>🎮 操作方法</h3>
                    <div class="instruction-item">
                        <span class="key">◀ ▶</span>
                        <span>左右移動</span>
                    </div>
                    <div class="instruction-item">
                        <span class="key">🎈</span>
                        <span>浮遊（減速）</span>
                    </div>
                </div>

                <button class="btn primary" id="startBtn">
                    <span class="btn-text">冒険を始める</span>
                </button>
            </div>
        </div>

        <!-- ゲームオーバー画面 -->
        <div id="gameOverScreen" class="screen hidden">
            <div class="screen-content">
                <div class="result-icon gameover">💫</div>
                <h2 class="result-title">Mission Failed</h2>
                
                <div class="stats-card">
                    <div class="stat-item">
                        <div class="stat-icon-large">🌍</div>
                        <div class="stat-data">
                            <div class="stat-number" id="finalDepth">0</div>
                            <div class="stat-unit">meters</div>
                        </div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-icon-large">⭐</div>
                        <div class="stat-data">
                            <div class="stat-number" id="finalStars">0</div>
                            <div class="stat-unit">stars</div>
                        </div>
                    </div>
                </div>

                <div id="newRecord" class="new-record hidden">
                    🎉 NEW RECORD! 🎉
                </div>

                <button class="btn primary" id="retryBtn">
                    <span class="btn-text">もう一度挑戦</span>
                </button>
            </div>
        </div>

        <!-- クリア画面 -->
        <div id="clearScreen" class="screen hidden">
            <div class="screen-content">
                <div class="result-icon clear">🌎✨</div>
                <h2 class="result-title clear">Mission Complete!</h2>
                <p class="clear-message">地球に無事到達しました！</p>
                
                <div class="stats-card clear">
                    <div class="stat-item">
                        <div class="stat-icon-large">🏆</div>
                        <div class="stat-data">
                            <div class="stat-number" id="clearDepth">10,000</div>
                            <div class="stat-unit">meters</div>
                        </div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-icon-large">⭐</div>
                        <div class="stat-data">
                            <div class="stat-number" id="clearStars">0</div>
                            <div class="stat-unit">stars</div>
                        </div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-icon-large">🔥</div>
                        <div class="stat-data">
                            <div class="stat-number" id="clearMaxCombo">0</div>
                            <div class="stat-unit">max combo</div>
                        </div>
                    </div>
                </div>

                <button class="btn primary clear" id="clearRetryBtn">
                    <span class="btn-text">もう一度プレイ</span>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
